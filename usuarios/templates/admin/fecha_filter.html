{% load i18n %}
<h3>{% trans "Por fecha" %}</h3>
<ul>
  <li>
    <form method="get">
      {% comment %} Preservar los demás filtros activos al aplicar este {% endcomment %}
      {% for k, v in request.GET.items %}
        {% if k != spec.parameter_name %}
          <input type="hidden" name="{{ k }}" value="{{ v }}">
        {% endif %}
      {% endfor %}

      <p class="admin-datetime">
        <input
          type="text"
          name="{{ spec.parameter_name }}"
          value="{{ spec.value|default:'' }}"
          class="vDateField"
          placeholder="yyyy-mm-dd"
          style="width:120px;"
        >
      </p>

      <input type="submit" value="Filtrar" style="margin-top:4px;">

      {% if spec.value %}
        <a href="?{% for k, v in request.GET.items %}{% if k != spec.parameter_name %}{{ k }}={{ v }}&{% endif %}{% endfor %}"
           style="display:block; margin-top:4px; font-size:12px;">
          Limpiar
        </a>
      {% endif %}
    </form>
  </li>
</ul>
